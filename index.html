<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG
    const svg = d3.select("#container")
      .append("svg")
      .attr("width", 960)
      .attr("height", 540);
      
    // Add Rectangles
    // Background
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", 960)
      .attr("height", 540)
      .attr("fill", "#7D4A00");

    // Ground
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 440)
      .attr("width", 960)
      .attr("height", 100)
      .attr("fill", "#4a3204");

    // Stem
    svg.append("rect")
      .attr("x", 450)
      .attr("y", 100)
      .attr("width", 60)
      .attr("height", 90)
      .attr("fill", "#030d01");

    // Circles
    // Center
    svg.append("circle")
      .attr("cx", 480)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "orange");
    
    // Left
    svg.append("circle")
      .attr("cx", 420)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "orange");

    // Right
    svg.append("circle")
      .attr("cx", 540)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "orange");

    // Add Lines
    svg.append("line")
      .attr("x1", 100)
      .attr("y1", 200)
      .attr("x2", 300)
      .attr("y2", 400)
      .attr("stroke", "black")
      .attr("stroke-width", 5);

    // Add Polygons
    svg.append("polygon")
      .attr("points", "100, 200 300, 300 200, 100")
      .attr("fill", "purple");

  </script>
</body>
</html>
