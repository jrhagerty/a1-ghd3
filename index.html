<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG
    const svg = d3.select("#container")
      .append("svg")
      .attr("width", 960)
      .attr("height", 540);
      
    // Add Rectangles
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", 960)
      .attr("height", 540)
      .attr("fill", "#7D4A00");

    // Add Circles
    svg.append("circle")
      .attr("cx", 200)
      .attr("cy", 200)
      .attr("r", 100)
      .attr("fill", "red");

    // Add Lines
    svg.append("line")
      .attr("x1", 100)
      .attr("y1", 200)
      .attr("x2", 300)
      .attr("y2", 400)
      .attr("stroke", "black")
      .attr("stroke-width", 5);

    // Add Polygons
    svg.append("polygon")
      .attr("points", "100, 200 300, 300 200, 100")
      .attr("fill", "purple");

  </script>
</body>
</html>
