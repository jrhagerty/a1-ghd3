<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG
    const svg = d3.select("#container")
      .append("svg")
      .attr("width", 960)
      .attr("height", 540);
      
    // Add Rectangles
    // Background
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", 960)
      .attr("height", 540)
      .attr("fill", "#7D4A00");

    // Ground
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 440)
      .attr("width", 960)
      .attr("height", 100)
      .attr("fill", "#4a3204");

    // Stem
    svg.append("rect")
      .attr("x", 450)
      .attr("y", 100)
      .attr("width", 60)
      .attr("height", 90)
      .attr("fill", "#030d01");

    // Circles
    // Center
    svg.append("circle")
      .attr("cx", 480)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "#f28c28");
    
    // Left
    svg.append("circle")
      .attr("cx", 420)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "#db771f");

    // Right
    svg.append("circle")
      .attr("cx", 540)
      .attr("cy", 300)
      .attr("r", 170)
      .attr("fill", "#db771f");

    // Add Lines
    // Vine
    svg.append("line")
      .attr("x1", 500)
      .attr("y1", 120)
      .attr("x2", 580)
      .attr("y2", 90)
      .attr("stroke", "green")
      .attr("stroke-width", 6);
    
    // Mouth
    svg.append("line")
      .attr("x1", 350)
      .attr("y1", 370)
      .attr("x2", 610)
      .attr("y2", 370)
      .attr("stroke", "black")
      .attr("stroke-width", 12);

    // Add Polygons
    // Leaf
    svg.append("polygon")
      .attr("points", "550, 80 600, 80 600, 100")
      .attr("fill", "green");
    
    // Left eye
    svg.append("polygon")
      .attr("points", "340, 270 390, 190 450, 270")
      

    // Right eye
    svg.append("polygon")
      .attr("points", "510, 270 570, 190 620, 270")
    
    // Nose
    svg.append("polygon")
      .attr("points", "480, 280 510, 340 450, 340")

  </script>
</body>
</html>
